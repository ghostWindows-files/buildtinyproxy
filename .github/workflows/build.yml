name: Build Tinyproxy

on:
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Clone Tinyproxy
        run: |
          git clone https://github.com/tinyproxy/tinyproxy.git tinyproxy_src
          cd tinyproxy_src

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libssl-dev zlib1g-dev

      - name: Build Tinyproxy
        run: |
          cd tinyproxy_src
          ./autogen.sh
          ./configure --prefix=/tmp/tinyproxy_build  # 指定安装到临时目录
          make
          make install

      - name: Create artifact
        run: |
          mkdir -p artifacts
          cp -r /tmp/tinyproxy_build/* artifacts/  # 复制整个临时目录
          # 或者，如果只需要可执行文件，可以使用以下命令：
          # cp /tmp/tinyproxy_build/sbin/tinyproxy artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tinyproxy-build
          path: artifacts/
