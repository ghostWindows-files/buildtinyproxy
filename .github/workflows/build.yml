name: Build Tinyproxy

on:
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Clone Tinyproxy
        run: |
          git clone https://github.com/tinyproxy/tinyproxy.git tinyproxy_src
          cd tinyproxy_src

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libssl-dev zlib1g-dev

      - name: Build Tinyproxy
        run: |
          cd tinyproxy_src
          ./autogen.sh
          ./configure
          make
          sudo make install

      - name: Create artifact
        run: |
          mkdir -p artifacts
          # 尝试查找 tinyproxy 的位置。  如果 make install 安装到了 /usr/local/sbin/，则使用以下命令。
          # 如果安装到了其他位置，请修改此行。
          cp /usr/local/sbin/tinyproxy artifacts/
          # 或者，如果 make install 没有指定安装目录，或者你希望安装到其他位置，
          # 你可能需要修改 Build Tinyproxy 步骤中的 configure 命令，添加 --prefix 选项来指定安装目录。
          # 例如：
          # ./configure --prefix=/opt/tinyproxy
          # 然后使用以下命令：
          # cp /opt/tinyproxy/sbin/tinyproxy artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tinyproxy-build
          path: artifacts/
