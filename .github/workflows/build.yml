name: Build Tinyproxy

on:
  push:
    branches:
      - main  # 或者你想要触发构建的分支
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Clone Tinyproxy
        run: |
          git clone https://github.com/tinyproxy/tinyproxy.git tinyproxy_src
          cd tinyproxy_src

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libssl-dev zlib1g-dev

      - name: Build Tinyproxy
        run: |
          cd tinyproxy_src
          ./autogen.sh
          ./configure
          make
          sudo make install

      - name: Create artifact
        run: |
          mkdir -p artifacts
          cp /usr/local/sbin/tinyproxy artifacts/  # 假设安装到 /usr/local/sbin/
        
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tinyproxy-build
          path: artifacts/
